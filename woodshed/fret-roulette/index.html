<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fret Roulette · Woodshed</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working screen. The readout and the neck are the page; settings sit quietly underneath. */
:root {
  --bg: #EDF1EF;
  --surface: #F9FBFA;
  --ink: #16211F;
  --muted: #586864;
  --line: #CDD7D3;
  --accent: #F2C230;
  --accent-strong: #A87C00;
  --accent-ink: #231A00;
  --focus: #0E6B5C;
  --wood: #2A201C;
  --fret: #C9CED1;
  --inlay: #E9E4D6;
  --string: #D8D2C0;
  --marker-ring: #FFF7D6;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111819; --surface: #1A2425; --ink: #E7EEEB; --muted: #93A4A0; --line: #2E3C3D;
    --accent: #F2C230; --accent-strong: #F2C230; --accent-ink: #231A00; --focus: #7FD6C4;
    --wood: #35271F; --fret: #AEB4B8; --inlay: #D9D3C2; --string: #CFC8B4; --marker-ring: #FFF7D6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111819; --surface: #1A2425; --ink: #E7EEEB; --muted: #93A4A0; --line: #2E3C3D;
  --accent: #F2C230; --accent-strong: #F2C230; --accent-ink: #231A00; --focus: #7FD6C4;
  --wood: #35271F; --fret: #AEB4B8; --inlay: #D9D3C2; --string: #CFC8B4; --marker-ring: #FFF7D6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.page {
  max-width: 1060px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 32px);
  padding-block: clamp(20px, 4vw, 40px);
  display: flex;
  flex-direction: column;
  gap: clamp(20px, 3vw, 32px);
}

header { display: flex; flex-direction: column; gap: 4px; }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: -0.01em;
  margin: 0;
}
header p { margin: 0; color: var(--muted); max-width: 62ch; }

/* Readout */
.stage {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px 32px;
}
.readout { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.readout-main {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.4rem, 9vw, 4.75rem);
  line-height: 1;
  letter-spacing: -0.03em;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0 0.4em;
  text-wrap: balance;
}
.readout-main .fret-num { font-variant-numeric: tabular-nums; }
.readout-main .soft { font-weight: 500; color: var(--muted); }
.readout-sub {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(1.2rem, 3.4vw, 1.7rem);
  line-height: 1.2;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  margin: 0;
}
.readout-sub strong { color: var(--ink); font-weight: 700; }

.next {
  font: inherit;
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.15rem;
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 999px;
  padding: 14px 26px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.08s ease;
}
.next:hover { filter: brightness(1.05); }
.next:active { transform: translateY(1px) scale(0.99); }
kbd {
  font-family: var(--body);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1.5px solid currentColor;
  border-radius: 5px;
  padding: 1px 6px;
  opacity: 0.7;
}
@media (hover: none) { kbd { display: none; } }

/* Neck */
.neck-wrap { overflow-x: auto; border-radius: 6px; }
.neck { display: block; width: 100%; min-width: 820px; height: auto; }
.neck .board { fill: var(--wood); }
.neck .nut { fill: var(--inlay); }
.neck .wire { stroke: var(--fret); stroke-width: 2.5; }
.neck .inlay { fill: var(--inlay); opacity: 0.85; }
.neck .str { stroke: var(--string); transition: opacity 0.15s; }
.neck .str.off { opacity: 0.22; }
.neck .dim { fill: var(--bg); opacity: 0.66; }
.neck .bracket { stroke: var(--accent-strong); stroke-width: 4; stroke-linecap: round; fill: none; }
.neck text { font-family: var(--body); font-variant-numeric: tabular-nums; }
.neck .num { fill: var(--muted); font-size: 12px; opacity: 0.6; }
.neck .num.in { fill: var(--ink); font-weight: 600; opacity: 1; }
.neck .sname { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
.neck .sname.off { fill: var(--muted); opacity: 0.45; }
.neck .marker { fill: var(--accent); stroke: var(--marker-ring); stroke-width: 2; transform-box: fill-box; transform-origin: center; }
.neck .marker.pop { animation: pop 0.28s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(0.2); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .neck .marker.pop { animation: none; } .next { transition: none; } }

/* Settings */
.settings {
  display: flex;
  flex-wrap: wrap;
  gap: 24px 48px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.group { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.group > .label, legend {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0;
}
fieldset { border: 0; margin: 0; padding: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.to { color: var(--muted); padding-inline: 4px; }

.stepper {
  display: inline-flex;
  align-items: stretch;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.stepper button {
  font: inherit; font-size: 1.2rem; line-height: 1;
  width: 40px; border: 0; background: transparent; color: var(--ink); cursor: pointer;
}
.stepper button:hover { background: var(--line); }
.stepper input {
  font: inherit; font-weight: 600; font-variant-numeric: tabular-nums;
  width: 3.2em; text-align: center;
  border: 0; border-inline: 1px solid var(--line);
  background: transparent; color: var(--ink);
  padding: 9px 0;
  -moz-appearance: textfield; appearance: textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.chip {
  font: inherit; font-weight: 600; font-variant-numeric: tabular-nums;
  min-width: 46px;
  padding: 8px 12px;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}
.chip small { font-weight: 400; opacity: 0.75; margin-right: 5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button {
  font: inherit; font-weight: 500; padding: 8px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; padding-block: 8px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent-strong); margin: 0; }

:is(button, input):focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.stepper :is(button, input):focus-visible { outline-offset: -3px; }

/* Recent */
.recent { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; color: var(--muted); font-size: 0.9rem; }
.recent .label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.recent ol { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
.recent li:first-child { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<nav class="ws-nav" aria-label="Practice tools"><div class="ws-inner"><a class="ws-home" href="../">Woodshed</a><div class="ws-links"><a href="../root-to-root/">Root to Root</a><a href="../fret-roulette/" aria-current="page">Fret Roulette</a><a href="../blind-voicings/">Blind Voicings</a><a href="../spelled-out/">Spelled Out</a><a href="../interval-mirror/">Interval Mirror</a></div></div></nav>
<script>(function(){var l=document.querySelector(".ws-links"),a=l&&l.querySelector("[aria-current]");if(a&&l.scrollWidth>l.clientWidth)l.scrollLeft=a.offsetLeft-l.offsetLeft-16;})();</script>
<div class="page">
  <header>
    <h1>Fret Roulette</h1>
    <p>Put a finger on the marked fret, then find the interval by ear from that note to the first note of your melody.</p>
  </header>

  <section class="stage">
    <div class="readout" aria-live="polite">
      <p class="readout-main" id="readout"></p>
      <p class="readout-sub" id="readoutSub"></p>
    </div>
    <button class="next" id="next" type="button">New position <kbd>Space</kbd></button>
  </section>

  <div class="neck-wrap" id="neckWrap">
    <svg class="neck" id="neck" viewBox="0 0 1000 200" role="img" aria-label="Guitar neck diagram showing the current position"></svg>
  </div>

  <section class="settings">
    <div class="group">
      <span class="label">Fret range</span>
      <div class="row">
        <span class="stepper">
          <button type="button" data-step="lo:-1" aria-label="Lower the lowest fret">−</button>
          <input id="lo" type="number" inputmode="numeric" min="1" max="24" aria-label="Lowest fret">
          <button type="button" data-step="lo:1" aria-label="Raise the lowest fret">+</button>
        </span>
        <span class="to">to</span>
        <span class="stepper">
          <button type="button" data-step="hi:-1" aria-label="Lower the highest fret">−</button>
          <input id="hi" type="number" inputmode="numeric" min="1" max="24" aria-label="Highest fret">
          <button type="button" data-step="hi:1" aria-label="Raise the highest fret">+</button>
        </span>
      </div>
    </div>

    <fieldset class="group">
      <legend>Strings</legend>
      <div class="row" id="strings"></div>
    </fieldset>

    <div class="group">
      <span class="label">Tuning</span>
      <div class="seg" id="tuning">
        <button type="button" data-tuning="fourths">All fourths</button>
        <button type="button" data-tuning="standard">Standard</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Note name</span>
      <label class="check"><input type="checkbox" id="showNote"> Show it</label>
    </div>
  </section>

  <section class="recent" aria-label="Recent positions">
    <span class="label">Recent</span>
    <ol id="history"></ol>
  </section>
</div>

<script>
(function () {
  var SVG = 'http://www.w3.org/2000/svg';
  var FRETS = 24;
  var NOTES = ['C', 'C♯/D♭', 'D', 'D♯/E♭', 'E', 'F', 'F♯/G♭', 'G', 'G♯/A♭', 'A', 'A♯/B♭', 'B'];
  var ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th'];
  // Index 0 is the 6th (lowest) string. Values are MIDI notes of the open strings.
  var TUNINGS = { fourths: [40, 45, 50, 55, 60, 65], standard: [40, 45, 50, 55, 59, 64] };
  var STORE = 'fret-roulette-settings';

  var state = { lo: 1, hi: 12, strings: [true, true, true, true, true, true], tuning: 'fourths', showNote: true, v: 2 };
  var current = null;
  var history = [];

  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved === 'object') {
      if (Number.isInteger(saved.lo) && Number.isInteger(saved.hi)) { state.lo = clamp(saved.lo); state.hi = clamp(saved.hi); }
      if (Array.isArray(saved.strings) && saved.strings.length === 6 && saved.strings.some(Boolean)) state.strings = saved.strings.map(Boolean);
      if (TUNINGS[saved.tuning]) state.tuning = saved.tuning;
      state.showNote = saved.v === 2 ? !!saved.showNote : true;
      if (state.lo > state.hi) state.hi = state.lo;
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
  function clamp(n) { return Math.min(FRETS, Math.max(1, n)); }

  // ---- geometry: real equal-temperament fret spacing ----
  var NUT = 34, END = 980, TOP = 26, GAP = 24;
  function fretX(n) { return NUT + (END - NUT) * (1 - Math.pow(2, -n / 12)) / 0.75; }
  function midX(n) { return (fretX(n - 1) + fretX(n)) / 2; }
  function stringY(i) { return TOP + (5 - i) * GAP; }

  function el(name, attrs, text) {
    var n = document.createElementNS(SVG, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  var neck = document.getElementById('neck');
  var parts = { strings: [], names: [], nums: [] };

  (function buildNeck() {
    neck.appendChild(el('rect', { class: 'board', x: NUT, y: 12, width: END - NUT, height: 148, rx: 3 }));
    [3, 5, 7, 9, 12, 15, 17, 19, 21, 24].forEach(function (f) {
      var r = Math.min(5, (fretX(f) - fretX(f - 1)) * 0.26);
      var ys = f % 12 === 0 ? [stringY(4) + GAP / 2, stringY(1) + GAP / 2] : [stringY(2) - GAP / 2];
      ys.forEach(function (y) { neck.appendChild(el('circle', { class: 'inlay', cx: midX(f), cy: y, r: r })); });
    });
    for (var f = 1; f <= FRETS; f++) {
      neck.appendChild(el('line', { class: 'wire', x1: fretX(f), x2: fretX(f), y1: 12, y2: 160 }));
      var t = el('text', { class: 'num', x: midX(f), y: 190, 'text-anchor': 'middle' }, f);
      parts.nums.push(t);
      neck.appendChild(t);
    }
    neck.appendChild(el('rect', { class: 'nut', x: NUT - 4, y: 12, width: 6, height: 148, rx: 1 }));
    for (var i = 0; i < 6; i++) {
      var s = el('line', { class: 'str', x1: NUT, x2: END, y1: stringY(i), y2: stringY(i), 'stroke-width': (3.2 - i * 0.42).toFixed(2) });
      var n = el('text', { class: 'sname', x: 14, y: stringY(i), 'text-anchor': 'middle', 'dominant-baseline': 'central' });
      parts.strings.push(s); parts.names.push(n);
      neck.appendChild(s); neck.appendChild(n);
    }
    parts.dimL = el('rect', { class: 'dim', y: 10, height: 152 });
    parts.dimR = el('rect', { class: 'dim', y: 10, height: 152 });
    parts.bracket = el('line', { class: 'bracket', y1: 170, y2: 170 });
    parts.marker = el('circle', { class: 'marker', r: 9 });
    [parts.dimL, parts.dimR, parts.bracket, parts.marker].forEach(function (p) { neck.appendChild(p); });
  })();

  // ---- naming ----
  function openName(i) { return NOTES[TUNINGS[state.tuning][i] % 12]; }
  function stringLabel(i) {
    var name = openName(i);
    var twins = TUNINGS[state.tuning].filter(function (m) { return m % 12 === TUNINGS[state.tuning][i] % 12; }).length > 1;
    return (twins ? (i < 3 ? 'Low ' : 'High ') : '') + name;
  }
  function noteAt(pos) { return NOTES[(TUNINGS[state.tuning][pos.s] + pos.f) % 12]; }

  // ---- picking ----
  function inBounds(pos) { return pos && state.strings[pos.s] && pos.f >= state.lo && pos.f <= state.hi; }
  function pick() {
    var pool = [];
    for (var s = 0; s < 6; s++) {
      if (!state.strings[s]) continue;
      for (var f = state.lo; f <= state.hi; f++) pool.push({ s: s, f: f });
    }
    if (pool.length > 1 && current) {
      pool = pool.filter(function (p) { return !(p.s === current.s && p.f === current.f); });
    }
    current = pool[Math.floor(Math.random() * pool.length)];
    history.unshift(current);
    if (history.length > 10) history.pop();
    render(true);
  }

  // ---- rendering ----
  var $ = function (id) { return document.getElementById(id); };
  var stringsBox = $('strings');
  for (var i = 5; i >= 0; i--) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.string = i;
    stringsBox.appendChild(b);
  }

  function render(moved) {
    // settings controls
    $('lo').value = state.lo; $('hi').value = state.hi;
    $('showNote').checked = state.showNote;
    stringsBox.querySelectorAll('button').forEach(function (b) {
      var i = +b.dataset.string;
      b.innerHTML = '<small>' + (6 - i) + '</small>' + openName(i);
      b.setAttribute('aria-pressed', state.strings[i]);
      b.setAttribute('aria-label', ORD[5 - i] + ' string, ' + stringLabel(i));
    });
    document.querySelectorAll('#tuning button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.tuning === state.tuning);
    });

    // neck
    for (var i = 0; i < 6; i++) {
      parts.strings[i].classList.toggle('off', !state.strings[i]);
      parts.names[i].classList.toggle('off', !state.strings[i]);
      parts.names[i].textContent = openName(i);
    }
    parts.nums.forEach(function (t, k) { t.classList.toggle('in', k + 1 >= state.lo && k + 1 <= state.hi); });
    var a = fretX(state.lo - 1), z = fretX(state.hi);
    parts.dimL.setAttribute('x', NUT + 2); parts.dimL.setAttribute('width', Math.max(0, a - NUT - 2));
    parts.dimR.setAttribute('x', z); parts.dimR.setAttribute('width', Math.max(0, END - z));
    parts.bracket.setAttribute('x1', a + 3); parts.bracket.setAttribute('x2', z - 3);

    if (current) {
      var w = fretX(current.f) - fretX(current.f - 1);
      parts.marker.setAttribute('cx', midX(current.f));
      parts.marker.setAttribute('cy', stringY(current.s));
      parts.marker.setAttribute('r', Math.min(9.5, w * 0.4));
      if (moved) {
        parts.marker.classList.remove('pop');
        void parts.marker.getBoundingClientRect();
        parts.marker.classList.add('pop');
        var wrap = $('neckWrap');
        if (wrap.scrollWidth > wrap.clientWidth) {
          var target = midX(current.f) / 1000 * wrap.scrollWidth - wrap.clientWidth / 2;
          try { wrap.scrollTo({ left: target, behavior: 'smooth' }); } catch (e) { wrap.scrollLeft = target; }
        }
      }
      if (state.showNote) {
        $('readout').textContent = noteAt(current);
        $('readoutSub').innerHTML = '<strong>' + stringLabel(current.s) + '</strong> string · fret <strong>' + current.f + '</strong>';
      } else {
        $('readout').innerHTML =
          '<span>' + stringLabel(current.s) + ' <span class="soft">string</span></span>' +
          '<span><span class="soft">fret</span> <span class="fret-num">' + current.f + '</span></span>';
        $('readoutSub').textContent = '';
      }
      $('readoutSub').hidden = !state.showNote;
      neck.setAttribute('aria-label', 'Guitar neck: ' + stringLabel(current.s) + ' string, fret ' + current.f +
        (state.showNote ? ', note ' + noteAt(current) : ''));
    }

    $('history').innerHTML = history.map(function (p) {
      return '<li>' + stringLabel(p.s) + ' · ' + p.f + '</li>';
    }).join('');
  }

  function settingsChanged() {
    save();
    if (inBounds(current)) render(false); else pick();
  }

  // ---- events ----
  $('next').addEventListener('click', pick);

  function setRange(which, value) {
    if (!Number.isFinite(value)) { render(false); return; }
    value = clamp(Math.round(value));
    state[which] = value;
    if (which === 'lo' && state.hi < value) state.hi = value;
    if (which === 'hi' && state.lo > value) state.lo = value;
    settingsChanged();
  }
  ['lo', 'hi'].forEach(function (id) {
    $(id).addEventListener('change', function (e) { setRange(id, parseFloat(e.target.value)); });
  });
  document.querySelectorAll('[data-step]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.dataset.step.split(':');
      setRange(p[0], state[p[0]] + (+p[1]));
    });
  });

  stringsBox.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var i = +b.dataset.string;
    var onCount = state.strings.filter(Boolean).length;
    if (state.strings[i] && onCount === 1) return; // keep at least one string
    state.strings[i] = !state.strings[i];
    settingsChanged();
  });

  $('tuning').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.tuning = b.dataset.tuning;
    save(); render(false);
  });

  $('showNote').addEventListener('change', function (e) {
    state.showNote = e.target.checked;
    save(); render(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (e.target.closest('input, button, select, textarea, a')) return;
    e.preventDefault();
    pick();
  });

  pick();
})();
</script>
</body>
</html>
